usage_plugin_remove = "tote plugin remove <id> [--yes] [--purge] [--json]"
usage_plugin_source = "<source> is a release URL of github.com, owner/repo@tag, the id of a plugin shipped with tote, or a path that starts with /, ./, ../ or ~/"
usage_plugin_update = "tote plugin update <id> [<source>] [--sha256 <hex>] [--grant <token>] [--dry-run] [--force] [--json]"
usage_repos_add = "tote repos add <name> <path> [--desc <text>]"
usage_repos_list = "tote repos [list] [--format table|tsv|json | --json]"
usage_repos_open = "tote repos open <name>"
usage_repos_rm = "tote repos rm <name> [--yes]"
usage_repos_root = "a relative <path> such as work/app is looked up under repos_root and used when that folder exists there"
usage_uninstall = "tote uninstall [--yes] [--shell] [--purge] [--dry-run]"
usage_uninstall_dry = "--dry-run prints what would be removed and changes nothing"
usage_uninstall_purge = "--shell also removes the line that loads tote from your startup files and lists the other lines that run tote init, which you remove by hand, --purge also deletes your tote data and, if a deletion fails, keeps the program so that you can run uninstall again"
usage_uninstall_yes = "--yes skips the questions"
usage_update = "tote update [--check] [--json] [--beta] [--force]"
usage_update_exit = "--check exits with 0 when tote is up to date and with 10 when a release is available"
usage_update_options = "--json prints the result as JSON, --beta also offers pre-releases, --force installs even an older or the same release"
usage_version = "tote version [--json]"
